<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>外籍保養品品牌在台大全</title>
  <style>
    :root {
      --bg: #0f1115; --card: #1a1d24; --text: #e8eaed; --muted: #9aa0a6;
      --accent: #ff4d4f; --accent-soft: rgba(255, 77, 79, 0.15); --border: #2a2f3a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif; background: var(--bg); color: var(--text); line-height: 1.65; }
    header { padding: 48px 20px 32px; text-align: center; background: linear-gradient(180deg,#1c1012 0%,var(--bg) 100%); border-bottom: 1px solid var(--border); }
    header h1 { font-size: clamp(1.6rem,4vw,2.2rem); }
    header p { color: var(--muted); max-width: 560px; margin: 12px auto 0; font-size: 0.95rem; }
    .wrap { max-width: 880px; margin: 0 auto; padding: 24px 16px 80px; }
    .disclaimer { background: var(--accent-soft); border: 1px solid rgba(255,77,79,.35); border-radius: 12px; padding: 16px 18px; font-size: 0.88rem; color: #ffccc7; margin-bottom: 24px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .toolbar input, .toolbar select { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 12px; border-radius: 8px; font-size: 0.95rem; }
    .toolbar input { flex: 1; min-width: 200px; }
    .stats { color: var(--muted); font-size: 0.85rem; margin-bottom: 16px; }
    .card { scroll-margin-top: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px 22px; margin-bottom: 14px; }
    .card h2 { font-size: 1.55rem; margin-bottom: 8px; letter-spacing: 0.02em; }
    .tag { display: inline-block; font-size: 0.72rem; padding: 3px 8px; border-radius: 999px; background: var(--accent-soft); color: #ff7875; margin-bottom: 8px; }
    .section-label { margin: 14px 0 8px; font-size: 0.78rem; color: var(--muted); font-weight: 600; }
    ul.links { list-style: none; padding-left: 0; }
    ul.links li { position: relative; margin: 6px 0; padding-left: 16px; font-size: 0.9rem; word-break: break-word; }
    ul.links li::before { content: "•"; position: absolute; left: 0; top: 0; color: #9aa0a6; }
    ul.links a { color: #7eb6ff; text-decoration: none; line-height:1.45; }
    .addr { position: relative; color: #d0d4db; font-size: 0.92rem; margin: 4px 0; padding-left: 16px; }
    .addr::before { content: "•"; position: absolute; left: 0; top: 0; color: #9aa0a6; }
    .preview { position: relative; display: flex; gap: 12px; background: #12151c; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; text-decoration: none; color: inherit; margin: 8px 0 10px 16px; }
    .preview::before { content: "•"; position: absolute; left: -16px; top: 10px; color: #9aa0a6; }
    .preview img { width: 168px; min-height: 94px; object-fit: cover; background: #000; flex-shrink: 0; }
    .preview .body { padding: 10px 12px; }
    .preview .kicker { font-size: 0.7rem; color: #9aa0a6; }
    .preview .title { font-size: 0.9rem; color: #e8eaed; font-weight: 600; }
    .empty { color: #6b7280; font-size: 0.85rem; }
    .form-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px 16px 8px; margin-top: 36px; }
    .form-box h2 { font-size: 1.15rem; margin-bottom: 10px; text-align: center; }
    .form-box p { color: var(--muted); font-size: 0.85rem; text-align: center; margin-bottom: 14px; }
    .form-box .open-btn { display: block; width: 100%; max-width: 360px; margin: 8px auto 16px; text-align: center; background: #1a73e8; color: #fff; text-decoration: none; padding: 12px 16px; border-radius: 10px; font-weight: 600; }
    .form-box .open-btn:hover { background: #1557b0; }
    footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 24px; }
    @media (max-width:560px){ .preview{flex-direction:column;} .preview img{width:100%;min-height:140px;} }
  
    .tree-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px 14px 22px; margin: 28px 0 18px; overflow-x: auto; }
    .tree-box h2 { font-size: 1.2rem; margin-bottom: 6px; }
    .tree-box .note { color: var(--muted); font-size: 0.82rem; margin-bottom: 12px; }
    .legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 0.76rem; color: var(--muted); margin-bottom: 16px; }
    .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 4px; vertical-align: middle; }
    .ppt { min-width: 760px; }
    .root { display: flex; flex-direction: column; align-items: center; gap: 8px; }
    .branches { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; margin-top: 18px; position: relative; }
    .branches::before { content: ""; position: absolute; top: -16px; left: 16.6%; right: 16.6%; border-top: 2px solid #5a6270; }
    .branch { background: #15181e; border: 1px solid var(--border); border-radius: 12px; padding: 12px 10px; display: flex; flex-direction: column; align-items: center; gap: 7px; position: relative; }
    .branch::before { content: ""; position: absolute; top: -16px; left: 50%; height: 16px; border-left: 2px solid #5a6270; }
    .node { position: relative; display: inline-block; }
    .chip { display: inline-block; padding: 6px 10px; border-radius: 8px; font-size: 0.82rem; line-height: 1.35; border: 1px solid var(--border); background: #22262e; color: var(--text); text-decoration: none; text-align: center; }
    .chip.brand { background: #3b2454; border-color: #7b5aa8; color: #f0e6ff; }
    .chip.green { background: #1b3a28; border-color: #3d8f5c; }
    .chip.blue { background: #1a2d44; border-color: #3d6ea3; }
    .chip.orange { background: #3a2a16; border-color: #c07a2a; }
    .chip.company { background: #2a2f3a; }
    .chip.shared { border-style: dashed; border-color: #c07a2a; }
    a.chip:hover { filter: brightness(1.15); }
    .sub { display: block; font-size: 0.7rem; color: var(--muted); }
    .lab { font-size: 0.7rem; color: var(--muted); margin-top: 4px; }
    .own { display: flex; flex-direction: column; align-items: center; gap: 6px; background: #15181e; border: 1px dashed #3d8f5c; border-radius: 10px; padding: 10px 12px; }
    .tip {
      display: none; position: absolute; left: 50%; transform: translateX(-50%);
      top: 100%; z-index: 30; background: #111; border: 1px solid #c07a2a;
      color: #ffe7c2; font-size: 0.74rem; padding: 8px 10px; margin-top: 0;
      border-radius: 8px; width: max-content; max-width: 260px;
    }
    .tip::before {
      content: ""; position: absolute; left: 0; right: 0; top: -14px; height: 14px;
    }
    .node:hover > .tip, .node.open > .tip { display: block; }
    a.tip { color:#ffe7c2; text-decoration:none; cursor: pointer; }
    a.tip:hover { text-decoration:underline; }
    
    .tip-list { display: none; flex-direction: column; gap: 6px; text-align: left; }
    .node:hover > .tip-list, .node.open > .tip-list { display: flex; }
    .tip a { color: #ffe7c2; text-decoration: none; display: block; }
    .tip a:hover { text-decoration: underline; }
    
    .branches::before { left: 16.6%; right: 50%; }
    .branch.no-link::before { display: none; }
    .dash-note { border-top: 1px dashed #c07a2a; margin-top: 14px; padding-top: 8px; font-size: 0.78rem; color: #e0b06a; }

  </style>
</head>
<body>
<header>
  <h1>外籍保養品品牌在台大全</h1>
  <p>最後更新：2026-11-12</p>
</header>
<div class="wrap">
  <div class="toolbar">
    <input id="q" type="search" placeholder="搜尋品牌、地址、連結…" oninput="filterCards()" />
    <select id="cat" onchange="filterCards()">
      <option value="">全部品牌</option>
      <option>Vine Vera</option><option>Lavelier</option><option>Opatra</option>
      <option>Truffoire</option><option>L’core</option><option>Orogold</option>
      <option>Seacret</option><option>Gratiae</option><option>Pearl de Flore</option>
      <option>Lionesse</option><option>Arthemis</option><option>Introstem</option>
      <option>Avinichi</option>
      <option>Napara</option><option>Hydrasphere＋</option>
      <option>Premier by Dead Sea</option>
      <option>CbGaRDN</option>
      <option>Bonage</option>
      <option>+Voupre</option>
      <option>Venofye</option>
    </select>
    <select id="region" onchange="filterCards()">
      <option value="">全部地區</option>
      <option>台北市</option>
      <option>新北市</option>
      <option>桃園市</option>
      <option>新竹縣</option>
      <option>台中市</option>
      <option>台南市</option>
      <option>地址未提供</option>
    </select>
  </div>
  <div class="stats" id="stats"></div>

<!-- FULL CONTENT CONTINUES - truncated for tool size, will use file -->
<p style="color:#ff7875">完整內容載入中…若你看到此訊息，請強制重新整理或告知 Grok 再推一次。</p>

<script>
function filterCards(){
  const q=document.getElementById('q').value.trim().toLowerCase();
  const cat=document.getElementById('cat').value;
  const region=document.getElementById('region').value;
  const cards=document.querySelectorAll('.card');
  let shown=0;
  cards.forEach(c=>{
    const regions=c.dataset.region||'';
    const show=(!q||c.innerText.toLowerCase().includes(q))
      &&(!cat||(c.dataset.cat||'').includes(cat))
      &&(!region||regions.includes(region));
    c.style.display=show?'':'none';
    if(show) shown++;
  });
  document.getElementById('stats').textContent='顯示 '+shown+' / '+cards.length+' 筆';
}
filterCards();
</script>
</div>
</body>
</html>
